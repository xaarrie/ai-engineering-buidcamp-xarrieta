[project]
name = "ai-engineering-buildcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = 'IBERNOVA\biarunxa', email = "x.arrieta@ibernova.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gitsource>=0.0.5",
    "jaxn>=0.0.5",
    "jupyter>=1.1.1",
    "markitdown[pdf]>=0.1.8",
    "minsearch>=0.2.0",
    "openai>=3.19.0",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
ai-engineering-buildcamp = "ai_engineering_buildcamp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
